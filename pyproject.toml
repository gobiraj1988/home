[project]
name = "apex-quant-mcp"
version = "0.1.0"
description = "Futuristic MCP server suite for the APEX Quant Forex trading bot: RAG document ingestion, live MT5 data, and Zapier-based backtest sharing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pandas>=2.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    'MetaTrader5>=5.0.45 ; platform_system == "Windows"',
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.6.0"]

[project.scripts]
apex-rag = "apex_mcp.rag_server:main"
apex-mt5 = "apex_mcp.mt5_server:main"
apex-share = "apex_mcp.share_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex_mcp*"]
